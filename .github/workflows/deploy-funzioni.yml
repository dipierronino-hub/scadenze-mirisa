# Pubblica le Cloud Functions (riepilogo Telegram) quando cambia la cartella functions/ su main.
# Si può lanciare anche a mano: Actions → Deploy funzioni → Run workflow.
name: Deploy funzioni

on:
  push:
    branches: [main]
    paths: ['functions/**', 'firebase.json']
  workflow_dispatch:

concurrency: deploy-funzioni

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROGETTO: scadenzario-pagamenti-16a28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installa e prova
        working-directory: functions
        run: npm install --no-audit --no-fund && npm test
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Deploy
        run: npx --yes firebase-tools@15 deploy --only functions --project "$PROGETTO" --force --non-interactive
